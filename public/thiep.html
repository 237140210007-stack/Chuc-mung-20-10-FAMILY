<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gia Đình Gửi Phụ Nữ Yêu Thương 💖</title>
  <link rel="stylesheet" href="/thiep.css">
</head>
<body>
  <!-- Hiệu ứng hoa/trái tim rơi nền -->
  <div class="snowflakes" aria-hidden="true">
    <div class="snowflake">🌸</div>
    <div class="snowflake">💖</div>
    <div class="snowflake">🌸</div>
    <div class="snowflake">✨</div>
    <div class="snowflake">💖</div>
    <div class="snowflake">🌸</div>
    <div class="snowflake">✨</div>
  </div>

  <!-- Nút điều khiển Bật/Tắt nhạc dành riêng cho điện thoại -->
  <div class="music-control" onclick="toggleMusic(event)">
    <span id="musicIcon">🎵</span>
  </div>

  <div class="card-container">
    <!-- 5 Bức ảnh phân bố 2 bên (Trái: Tiên, Nga | Phải: Nguyệt, Mẹ, Hải) -->
    <div class="floating-photos">
      <div class="photo-item photo-left-top">
        <img src="/Tien.jpg" alt="Tiên">
        <span>Cô Tiến 🌸</span>
      </div>
      <div class="photo-item photo-left-bottom">
        <img src="/Nga.jpg" alt="Nga">
        <span>Cô Nga 🌷</span>
      </div>
      <div class="photo-item photo-right-top">
        <img src="/Nguyet.jpg" alt="Nguyệt">
        <span>Cô Nguyệt ✨</span>
      </div>
      <div class="photo-item photo-right-middle">
        <img src="/me.jpg" alt="Mẹ">
        <span>Mẹ Yêu 💖</span>
      </div>
      <div class="photo-item photo-right-bottom">
        <img src="/Hai.jpg" alt="Hải">
        <span>Cô Hải 🌺</span>
      </div>
    </div>

    <!-- Khung thiệp chính -->
    <div class="card" onclick="toggleCard()">
      <!-- Mặt ngoài thiệp -->
      <div class="card-front">
        <div class="heart-icon">❤️</div>
        <h2>Gửi Phụ Nữ Nhà Mình!</h2>
        <p class="tap-hint">👉 Bấm vào đây để mở thiệp nhé 👈</p>
      </div>

      <!-- Mặt trong thiệp -->
      <div class="card-inside">
        <h3 class="title">Kính Chúc Phụ Nữ Nhà Mình Nhân Ngày Yêu Thương 20/10! 🌹</h3>
        
        <!-- Trái tim 3D ở trung tâm -->
        <div class="center-heart-container">
          <div class="beating-heart">💖</div>
        </div>

        <p id="typedText" class="message"></p>
        <div class="signature">Gia đình yêu thương rất nhiều! ❤️</div>
      </div>
    </div>
  </div>

  <!-- Nhạc nền không lời tương thích 100% Mobile -->
  <audio id="bgMusic" loop playsinline preload="auto">
    <source src="https://assets.mixkit.co/music/preview/mixkit-beautiful-dream-493.mp3" type="audio/mpeg">
  </audio>

  <script src="/thiep.js"></script>
</body>
</html>
