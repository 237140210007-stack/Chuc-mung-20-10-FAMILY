<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chúc Mừng Sinh Nhật Bố Yêu 🎂💖</title>
  <link rel="stylesheet" href="/thiep.css">
</head>
<body>
  <!-- Hiệu ứng bóng bay & bóng bóng rơi nhẹ nhàng -->
  <div class="balloons" aria-hidden="true">
    <div class="balloon">🎈</div>
    <div class="balloon">✨</div>
    <div class="balloon">🎂</div>
    <div class="balloon">🎈</div>
    <div class="balloon">🎁</div>
    <div class="balloon">✨</div>
  </div>

  <!-- Nút Bật/Tắt Nhạc nổi góc trên -->
  <div class="music-control" id="musicBtn" onclick="toggleMusic(event)">
    <span id="musicIcon">🎵</span>
  </div>

  <div class="card-container">
    <!-- Khung thiệp chính -->
    <div class="card" onclick="toggleCard()">
      <!-- Mặt ngoài thiệp -->
      <div class="card-front">
        <div class="cake-icon">🎂</div>
        <h2>Chúc Mừng Sinh Nhật Bố!</h2>
        <p class="tap-hint">👉 Bấm vào đây để mở thiệp nhé 👈</p>
      </div>

      <!-- Mặt trong thiệp -->
      <div class="card-inside">
        <h3 class="title">Happy Birthday Bố Iu!🎉🎁</h3>
        
        <!-- Bánh sinh nhật 3D đập nhẹ ở trung tâm -->
        <div class="center-heart-container">
          <div class="beating-heart">🎂</div>
        </div>
  </div>

  <!-- Trình phát YouTube ẩn phát đoạn Điệp khúc bài "Ba Kể Con Nghe" -->
  <div id="yt-player" style="position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none;"></div>

  <!-- Audio MP3 dự phòng -->
  <audio id="bgMusic" loop playsinline webkit-playsinline preload="auto">
    <source src="https://assets.mixkit.co/music/preview/mixkit-beautiful-dream-493.mp3" type="audio/mpeg">
  </audio>

  <!-- Nạp API YouTube -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/thiep.js"></script>
</body>
</html>
