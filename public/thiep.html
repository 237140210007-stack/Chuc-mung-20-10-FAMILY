<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chúc Mừng Sinh Nhật Bố Yêu 🎂💖</title>
  <link rel="stylesheet" href="/thiep.css">
</head>
<body>
  <!-- Hiệu ứng bóng bay & bóng rơi nhẹ nhàng -->
  <div class="balloons" aria-hidden="true">
    <div class="balloon">🎈</div>
    <div class="balloon">✨</div>
    <div class="balloon">🎂</div>
    <div class="balloon">🎈</div>
    <div class="balloon">🎁</div>
    <div class="balloon">✨</div>
  </div>

  <div class="card-container">
    <!-- Khung thiệp chính -->
    <div class="card" onclick="toggleCard()">
      <!-- Mặt ngoài thiệp -->
      <div class="card-front">
        <div class="cake-icon">🎂</div>
        <h2>Chúc Mừng Sinh Nhật Bố!</h2>
        <p class="tap-hint">👉 Bấm vào đây để mở thiệp nhé 👈</p>
      </div>

      <!-- Mặt trong thiệp -->
      <div class="card-inside">
        <h3 class="title">Happy Birthday Bố Yêu! 🎉🎁</h3>
        
        <!-- Bánh sinh nhật 3D đập nhẹ ở trung tâm -->
        <div class="center-heart-container">
          <div class="beating-heart">🎂</div>
        </div>

        <p id="typedText" class="message"></p>
        <div class="signature">❤️</div>
      </div>
    </div>
  </div>

  <!-- Iframe YouTube ẨN HOÀN TOÀN (Kích thước 1x1px giấu kín) -->
  <iframe 
    id="ytAudio" 
    style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: none;"
    src="" 
    allow="autoplay">
  </iframe>

  <script src="/thiep.js"></script>
</body>
</html>
